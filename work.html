<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5f3ee"><title>Selected work — Senda de Palabras</title>
<style>
:root{--paper:#f5f3ee;--ink:#242520;--muted:#6e7068;--line:#d8d7ce;--accent:#8a4e38;--serif:Georgia,"Times New Roman",serif;--sans:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 var(--sans)}a{color:inherit;text-underline-offset:4px}a:hover{color:var(--accent)}.wrap{width:min(900px,calc(100% - 40px));margin:auto}.top{border-bottom:1px solid var(--line)}.nav{min-height:76px;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font:1.3rem var(--serif);text-decoration:none}.toggle{border:1px solid var(--line);border-radius:999px;background:transparent;padding:7px 12px;cursor:pointer}.back{display:inline-block;margin:36px 0 48px;color:var(--accent);font-size:.85rem;text-decoration:none}.kind{font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}h1{font:400 clamp(2.8rem,8vw,5.5rem)/1.05 var(--serif);letter-spacing:-.055em;margin:16px 0 24px}.summary{font:1.3rem/1.6 var(--serif);max-width:720px}.meta{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 48px}.pill{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.75rem;color:var(--muted)}.body{border-top:1px solid var(--line);padding:32px 0 70px;max-width:720px}.body p{color:#55574f}.note{background:#eae7de;padding:18px 20px;font-size:.9rem}.footer{border-top:1px solid var(--line);padding:25px 0 40px;color:var(--muted);font-size:.8rem}@media(max-width:560px){.nav{min-height:68px}.back{margin:28px 0 36px}.summary{font-size:1.15rem}}
</style>
</head>
<body>
<header class="top"><div class="wrap nav"><a class="brand" href="index.html">Senda de Palabras</a><button id="toggle" class="toggle" type="button">ES</button></div></header>
<main class="wrap"><a class="back" href="index.html" data-en="← Back to the portfolio" data-es="← Volver al portafolio">← Back to the portfolio</a>
<article id="entry"><p class="kind">Selected work</p><h1>Loading…</h1></article></main>
<footer class="wrap footer">Senda de Palabras · <span data-en="Writing and translation portfolio" data-es="Portafolio de escritura y traducción">Writing and translation portfolio</span></footer>
<script>
(() => {
const works = {
"diamond-sutra":{title:["The Diamond Sutra","El Sutra del Diamante"],kind:["Translation · Buddhist text","Traducción · Texto budista"],summary:["A Spanish translation based on the Chinese text associated with Kumārajīva, attentive to the sutra’s direct language and productive ambiguities.","Una traducción al español basada en el texto chino asociado con Kumārajīva, atenta al lenguaje directo del sutra y a sus ambigüedades fecundas."],langs:["Spanish","Español"],status:["Book project · Editorial work ongoing","Proyecto de libro · En revisión editorial"],note:["This page introduces the project; the full translation is not published here.","Esta página presenta el proyecto; la traducción completa no se publica aquí."]},
"after-writing-a-poem":{title:["After Writing a Poem","Después de escribir un poema"],kind:["Translation · Classical Chinese","Traducción · Chino clásico"],summary:["A translation and close reading of a short poem by Jia Dao, exploring how a few lines can hold the labor and uncertainty of writing.","Traducción y lectura atenta de un poema breve de Jia Dao, sobre cómo unos pocos versos pueden contener el trabajo y la incertidumbre de escribir."],langs:["Spanish","Español"],status:["Published on the blog · Revision possible","Publicado en el blog · Sujeto a revisión"],note:["The published version can be found through the Senda de Palabras blog archive.","La versión publicada puede consultarse en el archivo del blog Senda de Palabras."]},
"pattern-not-rhyme":{title:["Pattern, not Rhyme","Pattern, not Rhyme"],kind:["Translation studies · Essay","Estudios de traducción · Ensayo"],summary:["A reflection on the choices involved in translating poetic form, sound, and meaning across languages.","Una reflexión sobre las decisiones que implica traducir la forma poética, el sonido y el sentido entre lenguas."],langs:["English only","Solo en inglés"],status:["Published on the blog","Publicado en el blog"],note:["This essay is currently listed in English only.","Este ensayo está disponible actualmente solo en inglés."]},
"what-is-dharma":{title:["What Is Dharma?","¿Qué es Dharma?"],kind:["Essay · Buddhist thought","Ensayo · Pensamiento budista"],summary:["A bilingual introduction to a word whose meanings shift across Buddhist teaching, practice, and ordinary use.","Una introducción bilingüe a una palabra cuyos sentidos cambian entre las enseñanzas budistas, la práctica y el uso cotidiano."],langs:["English · Spanish","Inglés · Español"],status:["Published in both languages","Publicado en ambos idiomas"],note:["This entry exists in English and Spanish. The language toggle changes the information on this page; the two versions of the essay are not yet reproduced here.","Esta entrada existe en inglés y español. El selector cambia la información de esta página; las dos versiones del ensayo todavía no se reproducen aquí."]},
"no-mountain":{title:["No Mountain","No Mountain"],kind:["Contemplative writing · Book project","Escritura contemplativa · Proyecto de libro"],summary:["A poetic reimagining of the Ten Oxherding Pictures through the imagery and discipline of mountain climbing.","Una recreación poética de las Diez imágenes del pastoreo del buey mediante las imágenes y la disciplina del alpinismo."],langs:["English · Spanish project","Proyecto en inglés y español"],status:["Book project","Proyecto de libro"],note:["A longer literary project in development; this page is a project overview, not the manuscript.","Un proyecto literario extenso en desarrollo; esta página presenta el proyecto, no el manuscrito."]},
"coffee-cup-sutra":{title:["The Coffee Cup Sutra","El Sutra de la Taza de Café"],kind:["Contemporary Buddhist-inspired writing","Escritura contemporánea inspirada en el budismo"],summary:["An original, playful text that brings Buddhist language into everyday life. It is contemporary creative writing, not a historical or canonical sutra.","Un texto original y lúdico que lleva el lenguaje budista a la vida cotidiana. Es escritura creativa contemporánea, no un sutra histórico o canónico."],langs:["Spanish · English","Español · Inglés"],status:["Original literary work","Obra literaria original"],note:["The language toggle changes this project description. The full texts can be added to this portfolio when ready for publication.","El selector cambia la descripción del proyecto. Los textos completos podrán añadirse al portafolio cuando estén listos para publicarse."]},
"sutras-for-modern-reading":{title:["Sutras for Modern Reading","Sutras para la lectura moderna"],kind:["Book project","Proyecto de libro"],summary:["A collection pairing accessible abridgments with fuller versions of Buddhist discourses, with attention to sources and editorial choices.","Una colección que combina versiones abreviadas y accesibles con versiones más completas de discursos budistas, atendiendo a las fuentes y decisiones editoriales."],langs:["Spanish","Español"],status:["Book project","Proyecto de libro"],note:["An ongoing editorial project. Individual texts will be added as their sources, permissions, and publication status are confirmed.","Proyecto editorial en desarrollo. Se añadirán textos individuales cuando se confirmen sus fuentes, permisos y estado de publicación."]},
"huineng-commentary":{title:["Huineng Commentary","Comentario de Huineng"],kind:["Translation project","Proyecto de traducción"],summary:["A Spanish translation project engaging with the Chinese commentary tradition surrounding the Diamond Sutra.","Proyecto de traducción al español que trabaja con la tradición china de comentarios al Sutra del Diamante."],langs:["Spanish","Español"],status:["In progress","En desarrollo"],note:["This is a project description rather than the complete translation.","Esta es una descripción del proyecto, no la traducción completa."]},
"devenir":{title:["Devenir","Devenir"],kind:["Fiction · Book project","Ficción · Proyecto de libro"],summary:["A Buddhist-inspired story shaped by the Mesoamerican path of the dead, memory, and the difficult crossing toward another shore.","Un relato inspirado en el budismo y el camino mesoamericano de los muertos, la memoria y el difícil cruce hacia otra orilla."],langs:["Spanish","Español"],status:["Fiction project","Proyecto narrativo"],note:["A literary manuscript in Spanish. This page provides a brief description rather than an excerpt.","Manuscrito literario en español. Esta página ofrece una breve descripción, no un fragmento."]}
};
let lang="en";const entry=document.getElementById("entry");const toggle=document.getElementById("toggle");
function render(){const slug=new URLSearchParams(location.search).get("work");const w=works[slug];document.documentElement.lang=lang;document.querySelectorAll("[data-en][data-es]").forEach(n=>n.textContent=n.dataset[lang]);toggle.textContent=lang==="en"?"ES":"EN";
if(!w){entry.innerHTML='<p class="kind">Senda de Palabras</p><h1>Work not found</h1><p><a href="index.html">Return to the portfolio</a></p>';return;}
entry.innerHTML='<p class="kind">'+w.kind[lang==="en"?0:1]+'</p><h1>'+w.title[lang==="en"?0:1]+'</h1><p class="summary">'+w.summary[lang==="en"?0:1]+'</p><div class="meta"><span class="pill">'+w.langs[lang==="en"?0:1]+'</span><span class="pill">'+w.status[lang==="en"?0:1]+'</span></div><div class="body"><p class="note">'+w.note[lang==="en"?0:1]+'</p><p>'+ (lang==="en"?"For now, this portfolio page provides context and status for the work. The complete text can be added here when it is ready to be shared.":"Por ahora, esta página del portafolio presenta el contexto y el estado de la obra. El texto completo podrá añadirse aquí cuando esté listo para compartirse.")+'</p><p><a href="https://senda-de-palabras.blogspot.com/" target="_blank" rel="noreferrer">'+(lang==="en"?"Visit the Senda de Palabras blog ↗":"Visitar el blog Senda de Palabras ↗")+'</a></p></div>';
}
toggle.addEventListener("click",()=>{lang=lang==="en"?"es":"en";render()});render();
})();
</script>
</body></html>
